name: famulus

services:
  famulus:
    build: .
    image: famulus:local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      FAMULUS_APP_ID: ${FAMULUS_APP_ID:?set through envkey}
      FAMULUS_APP_KEY_B64: ${FAMULUS_APP_KEY_B64:?set through envkey}
      # Optional: the bot token for outage messages to telegram_chat.
      FAMULUS_TELEGRAM_TOKEN: ${FAMULUS_TELEGRAM_TOKEN:-}
      # Optional logins; empty means that agent is not used.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      # admin panel, local only
      - 127.0.0.1:8080:8080
    volumes:
      - ./famulus.toml:/etc/famulus/famulus.toml:ro
      - work:/work
      # CLI logins and agent sessions survive restarts: ~/.codex, ~/.claude, opencode data.
      - home:/home/node
    cpus: 4
    mem_limit: 6g

volumes:
  work:
  home:
