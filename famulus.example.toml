# Copy to famulus.toml next to compose.yaml.

# GitHub login whose labels and comments the runner obeys. Nobody else's text reaches an agent.
owner = "daniil4545"

# Issues with this label are queued; states go to labels agent:working, agent:pr, ...
label = "agent"

interval = "60s"   # pause between passes
timeout = "60m"    # one agent run
limit_pause = "1h" # rest after a used-up plan when the provider names no time
daily_limit = 5    # new issues started per UTC day; 0 turns the cap off
work_dir = "/work" # clones, worktrees and state.json, a Docker volume
alert_repo = "daniil4545/famulus" # failure issues; empty or omitted disables alerts
# Files whose change needs the owner's gate-change label. Default shown.
# gate_files = [".github/workflows/**", ".github/actions/**", ".golangci.yml", ".golangci.yaml", ".golangci.toml", ".swiftlint.yml", ".gitleaks.toml", "ruff.toml", "Makefile", "*.mk"]

# Default agent: opencode, claude or codex. An issue label agent:<name> overrides it.
agent = "opencode"

[models]
# Free OpenCode Zen model, works without a key.
opencode = "opencode/glm-5.3-flash-free"
# Empty means the CLI's default model.
claude = "claude-sonnet-5-5"
codex = ""

[effort]
# Reasoning effort: low, medium, high, xhigh or max; only claude takes it. Leave the key out for the CLI's default.
claude = "medium"

[[repos]]
name = "daniil4545/admitd-lab"
base = "main"
# review = true  # review the owner's PRs: CI result, red base, gate files (see docs/spec.md)

